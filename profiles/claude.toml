name = "claude"
description = "Anthropic Claude Code"

[locate]
mise = "claude"
commands = ["claude"]
paths = ["~/.local/share/claude/local/claude", "~/.claude/local/claude"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
yolo_args = ["--dangerously-skip-permissions"]
env = { DISABLE_AUTOUPDATER = "1" }

[state]
# Holds the account token and the MCP OAuth tokens (mcpOAuth).
auth = [".claude/.credentials.json"]
import_ro = [
  ".claude/settings.json",
  ".claude/CLAUDE.md",
  ".claude/agents",
  ".claude/commands",
  ".claude/skills",
  ".claude/output-styles",
  ".agents/skills",
]
env_pass = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "CLAUDE_CODE_USE_BEDROCK", "CLAUDE_CODE_USE_VERTEX"]

# Omarchy's account switch: CLAUDE_CONFIG_DIR replaces ~/.claude, and
# ~/.claude.json moves into that folder. `paddock wrap` uses the folder as
# the login of the sandbox.
[state.account]
env = "CLAUDE_CONFIG_DIR"
dir = ".claude"
also = [".claude.json"]

# Claude Code keeps one folder per project in ~/.claude/projects. The host
# folder of this project is bound, so tools on the host (the Omarchy agents
# panel, `claude --resume`) see the sessions. No other project is visible.
[state.history]
project_folders = ".claude/projects"

# ~/.claude.json also holds the history of every project, so only these keys are copied.
[[state.json_import]]
file = ".claude.json"
keys = [["mcpServers"], ["projects", "{project}", "mcpServers"], ["hasCompletedOnboarding"], ["lastOnboardingVersion"], ["theme"]]
shared_keys = [["oauthAccount"], ["userID"]]

[[mcp]]
file = ".claude.json"
path = ["mcpServers"]

[[mcp]]
file = ".claude.json"
path = ["projects", "{project}", "mcpServers"]

[[mcp]]
file = ".mcp.json"
in_project = true
path = ["mcpServers"]

[network]
endpoints = ["api.anthropic.com", "claude.ai", "console.anthropic.com", "statsig.anthropic.com"]

# Telemetry and crash reports off, with the narrow variables. Any value
# opts out, so vendor mode leaves them unset. DISABLE_TELEMETRY also stops
# feature-flag fetching, which some features need (Remote Control).
# https://code.claude.com/docs/en/env-vars and https://code.claude.com/docs/en/data-usage
# The feedback commands stay: they send data only when the user runs them.
[privacy]
env = { DISABLE_TELEMETRY = "1", DISABLE_ERROR_REPORTING = "1", CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1" }

# Consumer accounts: "Help improve Claude". Commercial and API accounts are
# not used for training by default. https://code.claude.com/docs/en/data-usage
[privacy.training]
setting = "claude.ai Settings, Privacy, Help improve Claude"
url = "https://claude.ai/settings/data-privacy-controls"

# One task without a terminal, for `paddock-host spawn`. `claude --help`:
# -p/--print prints the response and exits; the prompt comes from stdin.
[oneshot]
args = ["-p", "--dangerously-skip-permissions"]
prompt = "stdin"
