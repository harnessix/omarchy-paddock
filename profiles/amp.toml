name = "amp"
description = "Amp"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "every entry: amp was not installed when this profile was written",
  "launch.yolo_args --dangerously-allow-all: from omarchy-agent, not Amp's manual",
]

# mise tool: amp
[locate]
mise = "amp"
commands = ["amp"]

[launch]
login_callback = true
yolo_args = ["--dangerously-allow-all"]
# The install is read-only in the sandbox; mise updates it on the host.
# https://ampcode.com/docs/cli/settings
env = { AMP_SKIP_UPDATE_CHECK = "1" }

[state]
# https://ampcode.com/security
auth = [".local/share/amp/secrets.json"]
import_ro = [".config/amp/AGENTS.md", ".config/amp/plugins", ".agents/skills"]
seed = [".config/amp/settings.json"]
env_pass = ["AMP_API_KEY"]

# Amp documents no telemetry switch. Threads are kept on Amp's servers.
[privacy.training]
setting = "the data settings of your Amp workspace"
url = "https://ampcode.com/security"

# One task without a terminal: -x reads the prompt from stdin, prints the
# final message and exits. https://ampcode.com/docs/cli/execute-mode
[oneshot]
args = ["--dangerously-allow-all", "-x"]
prompt = "stdin"
