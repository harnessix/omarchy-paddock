name = "copilot"
description = "GitHub Copilot CLI"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "state.auth .copilot/config.json: where the token is kept",
  "a full run inside paddock",
]

[locate]
mise = "copilot"
commands = ["copilot"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
# Keeps its token in the system keyring: use a private one per sandbox.
keyring = true
yolo_args = ["--allow-all-tools", "--allow-all-paths"]

[state]
auth = [".copilot/config.json"]
import_ro = [".agents/skills"]
env_pass = ["COPILOT_GITHUB_TOKEN", "GH_TOKEN", "GITHUB_TOKEN"]

[network]
endpoints = ["api.githubcopilot.com", "api.github.com", "github.com"]

# The flag turns off the telemetry that the CLI sends. It is not saved in the
# configuration, so it is passed on each start. GitHub's server side is not
# affected.
# https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli
[privacy]
args = ["--disable-client-telemetry"]

# https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies
[privacy.training]
setting = "GitHub Settings, Copilot, Allow GitHub to use my data for AI model training"
url = "https://github.com/settings/copilot"

# One task without a terminal, for `paddock-host spawn`. `copilot --help`:
# -p runs one prompt and exits, --allow-all-tools is required for it, -s
# prints only the answer. The prompt text is fixed and names the file.
[oneshot]
args = ["--allow-all-tools", "--allow-all-paths", "-s", "-p", "Read the file {prompt_file} and do the task that it describes."]
prompt = "file"
