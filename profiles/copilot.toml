name = "copilot"
description = "GitHub Copilot CLI"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "state.auth .copilot/config.json: where the token is kept",
  "a full run inside paddock",
]

[locate]
mise = "copilot"
commands = ["copilot"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
# Keeps its token in the system keyring: use a private one per sandbox.
keyring = true
yolo_args = ["--allow-all-tools", "--allow-all-paths"]

[state]
auth = [".copilot/config.json"]
import_ro = [".agents/skills"]
env_pass = ["COPILOT_GITHUB_TOKEN", "GH_TOKEN", "GITHUB_TOKEN"]

[network]
endpoints = ["api.githubcopilot.com", "api.github.com", "github.com"]
