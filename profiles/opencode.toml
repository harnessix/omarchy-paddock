name = "opencode"
description = "opencode"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "state.auth: auth.json and mcp-auth.json paths",
  "mcp: the 'mcp' table in opencode.json",
  "launch.yolo_args --auto with deny rules",
]

[locate]
mise = "opencode"
commands = ["opencode"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
# Approves every permission that a configuration rule does not deny.
yolo_args = ["--auto"]

[state]
auth = [".local/share/opencode/auth.json", ".local/share/opencode/mcp-auth.json"]
import_ro = [".config/opencode", ".agents/skills"]
env_pass = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "OPENROUTER_API_KEY", "GEMINI_API_KEY"]

[[mcp]]
file = ".config/opencode/opencode.json"
path = ["mcp"]

[[mcp]]
file = "opencode.json"
in_project = true
path = ["mcp"]

# opencode documents no telemetry switch. Inline configuration overrides the
# project opencode.json, so a project file cannot turn on automatic sharing
# of sessions; /share still works.
# https://opencode.ai/docs/config/ and https://opencode.ai/docs/share/
[privacy]
env = { OPENCODE_CONFIG_CONTENT = '{"share":"manual"}' }

# opencode is a client: the account settings of the model provider apply.
[privacy.training]
setting = "the data settings of the model provider you sign in to"
url = "https://opencode.ai/docs/providers/"
