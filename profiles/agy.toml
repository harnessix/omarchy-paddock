name = "agy"
description = "Google Antigravity CLI"

# Tested inside paddock: a login, full one-shot runs, the seeded settings and
# MCP tool cache, and the onboarding flags.

[locate]
mise = "agy"
commands = ["agy", "antigravity"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
yolo_args = ["--dangerously-skip-permissions"]

[state]
auth = [".gemini/antigravity-cli/antigravity-oauth-token", ".gemini/antigravity-cli/mcp_oauth_tokens.json"]
import_ro = [".gemini/settings.json", ".gemini/GEMINI.md", ".agents/skills"]
seed = [".gemini/antigravity-cli/settings.json", ".gemini/antigravity-cli/mcp"]
# Antigravity's finished onboarding. Only true values are carried, in both directions.
done_flags = { ".gemini/antigravity-cli/cache/onboarding.json" = ["onboardingComplete", "consumerOnboardingComplete"] }
env_pass = ["GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_CLOUD_PROJECT"]

[network]
endpoints = ["generativelanguage.googleapis.com", "oauth2.googleapis.com", "cloudcode-pa.googleapis.com"]

# "Enable Telemetry" is saved with the account, not in settings.json, so no
# file or variable can turn it off. It also covers the use of interactions
# to improve Antigravity and models. https://antigravity.google/docs/settings
# The onboarding screen has the data-use opt-in checked by default. paddock
# carries the finished onboarding (state.done_flags), so the screen does not
# come back in each new project.
[privacy.training]
setting = "type /settings in agy and turn off Enable Telemetry"
url = "https://antigravity.google/docs/settings"
onboarding = "Its data-use box there is checked by default."

# One task without a terminal, for `paddock-host spawn`. `agy --help`:
# --print runs one prompt and prints the response; the prompt is the value
# of --print, so it is fixed text that names the file.
[oneshot]
args = ["--dangerously-skip-permissions", "--print", "Read the file {prompt_file} and do the task that it describes."]
prompt = "file"

# A detached run (paddock run --detach): agy's terminal UI with the task as
# its first prompt. `agy --help`: -i (--prompt-interactive) runs an initial
# prompt interactively and continues the session.
[detach]
args = ["-i", "Read the file {prompt_file} and do the task that it describes."]
