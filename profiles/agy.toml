name = "agy"
description = "Google Antigravity CLI"

# Tested inside paddock: a login, full one-shot runs, the seeded settings and
# MCP tool cache, and the onboarding flags.

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "compaction: agy writes transcript.jsonl again with fewer lines when it compacts, with a CHECKPOINT step for the summary",
]

[locate]
mise = "agy"
commands = ["agy", "antigravity"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
yolo_args = ["--dangerously-skip-permissions"]

[state]
auth = [".gemini/antigravity-cli/antigravity-oauth-token", ".gemini/antigravity-cli/mcp_oauth_tokens.json"]
import_ro = [".gemini/settings.json", ".gemini/GEMINI.md", ".agents/skills"]
seed = [".gemini/antigravity-cli/settings.json", ".gemini/antigravity-cli/mcp"]
# Antigravity's finished onboarding. Only true values are carried, in both directions.
done_flags = { ".gemini/antigravity-cli/cache/onboarding.json" = ["onboardingComplete", "consumerOnboardingComplete"] }
env_pass = ["GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_CLOUD_PROJECT"]
# agy renews its access token only while it runs. `agy models` lists the
# models of the account from the server, so it needs a valid login and
# renews a lapsed one. It does no model work. The agents panel runs it when
# the newest copy of the login has lapsed (usage_box/refresh.rs).
refresh = ["agy", "models"]

[network]
endpoints = ["generativelanguage.googleapis.com", "oauth2.googleapis.com", "cloudcode-pa.googleapis.com"]

# "Enable Telemetry" is saved with the account, not in settings.json, so no
# file or variable can turn it off. It also covers the use of interactions
# to improve Antigravity and models. https://antigravity.google/docs/settings
# The onboarding screen has the data-use opt-in checked by default. paddock
# carries the finished onboarding (state.done_flags), so the screen does not
# come back in each new project.
[privacy.training]
setting = "type /settings in agy and turn off Enable Telemetry"
url = "https://antigravity.google/docs/settings"
onboarding = "Its data-use box there is checked by default."

# The training gate (training.rs). agy 1.4 shows "Terms of Service & Data
# Use" after the theme choice of its onboarding, with the opt-in checked
# and the focus on it. agy wraps the text to the terminal width, so the
# rows hold at the recorded width of 49 columns, and paddock gives agy that
# width while the gate runs. The checked screen and the screens before and
# after it come from a real login (2026-11-02). The three other states are
# not recorded yet: they follow agy's own focus mark "> ". When a state
# differs, paddock stops and leaves the screen to the user.
# https://antigravity.google/terms
[[privacy.training.rule]]
id = "agy-1.4-data-use"
url = "https://antigravity.google/docs/settings"
title = "Terms of Service & Data Use"
cols = 49
until_done = true
# The login and theme screens before the dialog. A user key there keeps the gate.
before = ["Select login method:", "Select Google Cloud sign-in method:", "Choose your color scheme:"]

# The recorded screen: the box is checked and has the focus. Enter toggles it.
[[privacy.training.rule.state]]
id = "checked"
send = "enter"
next = ["unchecked"]
rows = [
  "Terms of Service & Data Use",
  "",
  "AI coding agents are known to have certain",
  "security risks, including autonomous code",
  "execution, data exfiltration, prompt injection",
  "and supply chain risks. Ensure that you monitor",
  "and verify all actions taken by the agent.",
  "",
  "-------------------------------------------------",
  "",
  "> [x] Yes, I agree to help improve Antigravity",
  "CLI by allowing Google to collect and use",
  "my Interactions data, subject to the",
  "Google Antigravity CLI Terms of Service",
  "and Google Privacy Policy. I understand I",
  "can choose to opt out later whenever I",
  "want via my settings.",
  "",
  "Links:",
  "- Terms of Service:",
  "https://antigravity.google/terms",
  "- Privacy Policy:",
  "https://policies.google.com/privacy",
  "",
  "[Previous]      [Done]",
  "",
  "",
  "↑/↓ Navigate · enter Toggle",
]

# The box is unchecked and keeps the focus. Down moves the focus to the buttons.
[[privacy.training.rule.state]]
id = "unchecked"
send = "down"
next = ["on-previous", "on-done"]
rows = [
  "Terms of Service & Data Use",
  "",
  "AI coding agents are known to have certain",
  "security risks, including autonomous code",
  "execution, data exfiltration, prompt injection",
  "and supply chain risks. Ensure that you monitor",
  "and verify all actions taken by the agent.",
  "",
  "-------------------------------------------------",
  "",
  "> [ ] Yes, I agree to help improve Antigravity",
  "CLI by allowing Google to collect and use",
  "my Interactions data, subject to the",
  "Google Antigravity CLI Terms of Service",
  "and Google Privacy Policy. I understand I",
  "can choose to opt out later whenever I",
  "want via my settings.",
  "",
  "Links:",
  "- Terms of Service:",
  "https://antigravity.google/terms",
  "- Privacy Policy:",
  "https://policies.google.com/privacy",
  "",
  "[Previous]      [Done]",
  "",
  "",
  "↑/↓ Navigate · enter Toggle",
]

# The box is unchecked, and [Previous] has the focus. Right moves to [Done].
[[privacy.training.rule.state]]
id = "on-previous"
send = "right"
next = ["on-done"]
rows = [
  "Terms of Service & Data Use",
  "",
  "AI coding agents are known to have certain",
  "security risks, including autonomous code",
  "execution, data exfiltration, prompt injection",
  "and supply chain risks. Ensure that you monitor",
  "and verify all actions taken by the agent.",
  "",
  "-------------------------------------------------",
  "",
  "[ ] Yes, I agree to help improve Antigravity",
  "CLI by allowing Google to collect and use",
  "my Interactions data, subject to the",
  "Google Antigravity CLI Terms of Service",
  "and Google Privacy Policy. I understand I",
  "can choose to opt out later whenever I",
  "want via my settings.",
  "",
  "Links:",
  "- Terms of Service:",
  "https://antigravity.google/terms",
  "- Privacy Policy:",
  "https://policies.google.com/privacy",
  "",
  "> [Previous]      [Done]",
]

# The box is unchecked, and [Done] has the focus. Enter submits the refusal.
[[privacy.training.rule.state]]
id = "on-done"
send = "enter"
next = ["gone"]
rows = [
  "Terms of Service & Data Use",
  "",
  "AI coding agents are known to have certain",
  "security risks, including autonomous code",
  "execution, data exfiltration, prompt injection",
  "and supply chain risks. Ensure that you monitor",
  "and verify all actions taken by the agent.",
  "",
  "-------------------------------------------------",
  "",
  "[ ] Yes, I agree to help improve Antigravity",
  "CLI by allowing Google to collect and use",
  "my Interactions data, subject to the",
  "Google Antigravity CLI Terms of Service",
  "and Google Privacy Policy. I understand I",
  "can choose to opt out later whenever I",
  "want via my settings.",
  "",
  "Links:",
  "- Terms of Service:",
  "https://antigravity.google/terms",
  "- Privacy Policy:",
  "https://policies.google.com/privacy",
  "",
  "[Previous]    > [Done]",
]

# agy has hooks but no compaction event, and no sure compaction marker in
# the transcript (transcriptPath in the hook input): a CHECKPOINT step also
# comes in a plain run, for the title and intent. PreInvocation runs before
# each model call. It counts a compaction only when the transcript has a
# CHECKPOINT step and fewer lines than before (compaction.rs `Steps`), and
# puts the note in with injectSteps[].ephemeralMessage. agy loads ~/.gemini/config/hooks.json
# without a trust step, and paddock owns the "paddock-compaction" entry in
# it. https://antigravity.google/docs/hooks
[[compaction.settings]]
file = ".gemini/config/hooks.json"
path = ["paddock-compaction"]
value = { PreInvocation = [{ type = "command", command = "paddock-host compacted --harness agy", timeout = 20 }] }

# One task without a terminal, for `paddock-host spawn`. `agy --help`:
# --print runs one prompt and prints the response; the prompt is the value
# of --print, so it is fixed text that names the file.
[oneshot]
args = ["--dangerously-skip-permissions", "--print", "Read the file {prompt_file} and do the task that it describes."]
prompt = "file"

# A detached run (paddock run --detach): agy's terminal UI with the task as
# its first prompt. `agy --help`: -i (--prompt-interactive) runs an initial
# prompt interactively and continues the session.
[detach]
args = ["-i", "Read the file {prompt_file} and do the task that it describes."]

# A message that stops a run (src/screens.rs). A detached agy run once sat
# on it until the idle end. paddock names it in the done text.
[[screens.error]]
text = "Individual quota reached"
says = "agy says the individual quota is used up"

# The user's own hooks (src/hooks.rs). Each user entry keeps its name with
# the prefix "user-", so paddock's entry comes first.
[hooks]
files = [".gemini/config/hooks.json"]
into = ".gemini/config/hooks.json"
path = []
style = "named"
