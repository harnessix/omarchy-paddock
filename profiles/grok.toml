name = "grok"
description = "xAI Grok Build"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "a login inside paddock (full runs with a shared login work)",
  "state.auth .grok/mcp_credentials.json: the file store for MCP OAuth tokens",
  "privacy.env: the false values of the GROK_TELEMETRY_* variables",
  "network.endpoints: the hosts for the allowlist network mode",
  "compaction: the note on the first PostToolUse after a PostCompact, from the source of grok-build",
]

[locate]
mise = "grok"
commands = ["grok"]

[launch]
# Logs in through a browser and a loopback callback on a random port
# (grok login --oauth). grok login --device-auth works without a callback.
login_callback = true
# The help text: "Auto-approve all tool executions".
yolo_args = ["--always-approve"]

[state]
# The host data that `--profile default` copies into a private snapshot.
data = [".grok"]
# The login token. MCP OAuth tokens are kept in mcp_credentials.json; there
# is no keyring.
auth = [".grok/auth.json", ".grok/mcp_credentials.json"]
import_ro = [".grok/AGENTS.md", ".grok/rules", ".grok/skills", ".grok/agents", ".agents/skills"]
# Writable copies: grok saves /settings into config.toml and pager.toml. Edits
# made in the sandbox are not copied back, and the host copy replaces them
# each start.
seed = [".grok/config.toml", ".grok/pager.toml"]
env_pass = ["XAI_API_KEY", "GROK_API_KEY"]

# Omarchy's account switch: GROK_HOME replaces ~/.grok.
[state.account]
env = "GROK_HOME"
dir = ".grok"

[[mcp]]
file = ".grok/config.toml"
format = "toml"
path = ["mcp_servers"]

[[mcp]]
file = ".grok/config.toml"
in_project = true
format = "toml"
path = ["mcp_servers"]

# Telemetry, from the Grok Build user guide, Configuration -> Telemetry and
# Environment variables -> Telemetry:
# https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/05-configuration.md
# DISABLE_TELEMETRY (usage metrics) and DISABLE_ERROR_REPORTING (crash
# reports) are in the copy of that guide that grok 1.0.70 installs in
# ~/.grok/docs/user-guide/05-configuration.md: "Any non-empty value ...
# works like 1". The public copy did not list them yet.
[privacy]
env = { GROK_TELEMETRY_ENABLED = "false", DISABLE_TELEMETRY = "1", DISABLE_ERROR_REPORTING = "1", GROK_TELEMETRY_TRACE_UPLOAD = "false", GROK_TELEMETRY_MIXPANEL_ENABLED = "false" }

# "Coding data, retention, and training" is an account setting that /privacy
# opens; telemetry switches do not change it. Same guide, Authentication ->
# Related settings:
# https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/02-authentication.md
[privacy.training]
setting = "type /privacy in grok and turn off coding-data sharing"
url = "https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/02-authentication.md#related-settings"

[network]
endpoints = ["api.x.ai", "x.ai", "grok.com"]

# Grok Build discards the output of its PreCompact and PostCompact hooks,
# and of an allowing UserPromptSubmit hook. A PostToolUse hook's
# hookSpecificOutput.additionalContext reaches the model. So PostCompact
# records the compaction and keeps the note, and the next PostToolUse hook
# adds it. Hooks in ~/.grok/hooks/*.json are always trusted. paddock owns
# this file in the sandbox home. User guide, Hooks:
# https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/10-hooks.md
[[compaction.settings]]
file = ".grok/hooks/paddock-compaction.json"
path = ["hooks", "PostCompact"]
value = [{ hooks = [{ type = "command", command = "paddock-host compacted --harness grok", timeout = 20 }] }]

[[compaction.settings]]
file = ".grok/hooks/paddock-compaction.json"
path = ["hooks", "PostToolUse"]
value = [{ hooks = [{ type = "command", command = "paddock-host compacted --harness grok", timeout = 10 }] }]

# One task without a terminal, for `paddock-host spawn`. `grok --help`:
# --prompt-file runs one turn with the prompt from a file and prints the
# response; --always-approve approves every tool.
[oneshot]
args = ["--always-approve", "--prompt-file", "{prompt_file}"]
prompt = "file"

# `paddock run --detach`: the interactive interface with a first prompt. The
# user guide, Getting started: a positional prompt launches the interactive
# TUI and submits it as the first turn.
# https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/01-getting-started.md
[detach]
args = ["Read the file {prompt_file} and do the task that it describes."]
