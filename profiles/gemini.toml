name = "gemini"
description = "Google Gemini CLI"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "every entry: gemini was not installed when this profile was written",
]

[locate]
mise = "gemini"
commands = ["gemini"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
yolo_args = ["--yolo"]

[state]
auth = [".gemini/oauth_creds.json", ".gemini/google_accounts.json", ".gemini/mcp-oauth-tokens.json"]
import_ro = [".gemini/GEMINI.md", ".agents/skills"]
seed = [".gemini/settings.json"]
env_pass = ["GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_CLOUD_PROJECT", "GOOGLE_GENAI_USE_VERTEXAI"]

[[mcp]]
file = ".gemini/settings.json"
path = ["mcpServers"]

[[mcp]]
file = ".gemini/settings.json"
in_project = true
path = ["mcpServers"]

[network]
endpoints = ["generativelanguage.googleapis.com", "oauth2.googleapis.com", "cloudcode-pa.googleapis.com"]

# Usage statistics off in the sandbox copy of settings.json. Telemetry is off
# by default, and the variable keeps it off.
# https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md
[privacy]
env = { GEMINI_TELEMETRY_ENABLED = "false" }

[[privacy.settings]]
file = ".gemini/settings.json"
path = ["privacy", "usageStatisticsEnabled"]
value = false

# The terms depend on how you sign in.
# https://github.com/google-gemini/gemini-cli/blob/main/docs/resources/tos-privacy.md
[privacy.training]
setting = "the privacy notice of your sign-in method"
url = "https://developers.google.com/gemini-code-assist/resources/privacy-notices"
