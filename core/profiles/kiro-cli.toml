name = "kiro-cli"
description = "Kiro CLI"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "every entry: kiro-cli was not installed when this profile was written",
  "state.auth .local/share/kiro-cli/data.sqlite3: where the login is kept",
  "the flat keys telemetry.enabled and app.disableAutoupdates in cli.json",
]

# mise tool: http:kiro-cli
[locate]
mise = "kiro-cli"
commands = ["kiro-cli"]

[launch]
login_callback = true
# `kiro-cli chat --trust-all-tools` trusts every tool for the session.
# https://kiro.dev/docs/cli/v3/permissions/
yolo_args = ["chat", "--trust-all-tools"]
probe_args = ["chat", "--help"]

[state]
auth = [".local/share/kiro-cli/data.sqlite3"]
import_ro = [".kiro/steering", ".kiro/agents", ".agents/skills"]
seed = [".kiro/settings/cli.json"]
env_pass = ["KIRO_API_KEY"]

# The install is read-only in the sandbox; mise updates it on the host.
# https://kiro.dev/docs/reference/settings/
[[state.settings]]
file = ".kiro/settings/cli.json"
path = ["app.disableAutoupdates"]
value = true

# https://kiro.dev/docs/reference/settings/
[[privacy.settings]]
file = ".kiro/settings/cli.json"
path = ["telemetry.enabled"]
value = false

[privacy.training]
setting = "the data settings of your Kiro account"
url = "https://kiro.dev/docs/reference/settings/"

# One task without a terminal: `chat --no-interactive` reads the prompt from
# stdin. https://kiro.dev/docs/cli/headless/
[oneshot]
args = ["chat", "--no-interactive", "--trust-all-tools"]
prompt = "stdin"
probe_args = ["chat", "--help"]
