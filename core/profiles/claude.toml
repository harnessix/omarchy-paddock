name = "claude"
description = "Anthropic Claude Code"

[locate]
mise = "claude"
commands = ["claude"]
paths = ["~/.local/share/claude/local/claude", "~/.claude/local/claude"]

[launch]
# Logs in through a browser and a localhost callback.
login_callback = true
yolo_args = ["--dangerously-skip-permissions"]
env = { DISABLE_AUTOUPDATER = "1" }

[state]
# The host data that `--profile default` copies into a private snapshot.
data = [".claude", ".claude.json"]
# Holds the account token and the MCP OAuth tokens (mcpOAuth).
auth = [".claude/.credentials.json"]
auth_expiry = { ".claude/.credentials.json" = "claudeAiOauth.expiresAt" }
import_ro = [
  ".claude/CLAUDE.md",
  ".claude/agents",
  ".claude/commands",
  ".claude/skills",
  ".claude/output-styles",
  ".agents/skills",
]
# A writable copy, so paddock can record the answers below. Edits made in the
# sandbox are not copied back, and the host copy replaces them each start.
seed = [".claude/settings.json"]
env_pass = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "CLAUDE_CODE_USE_BEDROCK", "CLAUDE_CODE_USE_VERTEX"]

# Omarchy's account switch: CLAUDE_CONFIG_DIR replaces ~/.claude, and
# ~/.claude.json moves into that folder. `paddock wrap` uses the folder as
# the login of the sandbox.
[state.account]
env = "CLAUDE_CONFIG_DIR"
dir = ".claude"
also = [".claude.json"]

# Claude Code keeps one folder per project in ~/.claude/projects. The host
# folder of this project is bound, so tools on the host (the Omarchy agents
# panel, `claude --resume`) see the sessions. No other project is visible.
[state.history]
project_folders = ".claude/projects"

# ~/.claude.json also holds the history of every project, so only these keys are copied.
[[state.json_import]]
file = ".claude.json"
keys = [["mcpServers"], ["projects", "{project}", "mcpServers"], ["hasCompletedOnboarding"], ["lastOnboardingVersion"], ["theme"]]
shared_keys = [["oauthAccount"], ["userID"]]

[[mcp]]
file = ".claude.json"
path = ["mcpServers"]

[[mcp]]
file = ".claude.json"
path = ["projects", "{project}", "mcpServers"]

[[mcp]]
file = ".mcp.json"
in_project = true
path = ["mcpServers"]

[network]
endpoints = ["api.anthropic.com", "claude.ai", "console.anthropic.com", "statsig.anthropic.com"]

# Telemetry and crash reports off, with the narrow variables. Any value
# opts out, so vendor mode leaves them unset. DISABLE_TELEMETRY also stops
# feature-flag fetching, which some features need (Remote Control).
# https://code.claude.com/docs/en/env-vars and https://code.claude.com/docs/en/data-usage
# The feedback commands stay: they send data only when the user runs them.
[privacy]
env = { DISABLE_TELEMETRY = "1", DISABLE_ERROR_REPORTING = "1", CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1" }

# Consumer accounts: "Help improve Claude". Commercial and API accounts are
# not used for training by default. https://code.claude.com/docs/en/data-usage
[privacy.training]
setting = "claude.ai Settings, Privacy, Help improve Claude"
url = "https://claude.ai/settings/data-privacy-controls"

# One task without a terminal, for `paddock-host spawn`. `claude --help`:
# -p/--print prints the response and exits; the prompt comes from stdin.
[oneshot]
args = ["-p", "--dangerously-skip-permissions"]
prompt = "stdin"
# `claude --help`: --model <model> and --effort <level>.
model_args = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]

# `paddock run --detach`: the interactive interface with a first prompt.
# `claude --help`: "Usage: claude [options] [command] [prompt]".
[detach]
args = ["Read the file {prompt_file} and do the task that it describes."]

# paddock is the external sandbox, so Claude Code's own two questions only
# stop a run that has no terminal (paddock run --detach): the warning about
# --dangerously-skip-permissions, and the trust question for the project.
# The bypass answer is set only when the run uses the auto-approval flag.
[[state.settings]]
file = ".claude/settings.json"
path = ["skipDangerousModePermissionPrompt"]
value = true
yolo_only = true

[[state.settings]]
file = ".claude.json"
path = ["projects", "{project}", "hasTrustDialogAccepted"]
value = true

# After a context compaction, Claude Code runs the SessionStart hooks with
# the source "compact" (the matcher selects it). The hook prints JSON, and
# hookSpecificOutput.additionalContext reaches the context. Hooks in
# ~/.claude/settings.json need no trust step beyond the project trust above.
# https://code.claude.com/docs/en/hooks
[[compaction.settings]]
file = ".claude/settings.json"
path = ["hooks", "SessionStart"]
append = true
value = { matcher = "compact", hooks = [{ type = "command", command = "paddock-host compacted --harness claude", timeout = 20 }] }

# The user's own hooks (src/hooks.rs): checked, then beside paddock's entry.
[hooks]
files = [".claude/settings.json"]
into = ".claude/settings.json"
