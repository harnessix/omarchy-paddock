name = "freebuff"
description = "Freebuff"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "every entry: freebuff was not installed when this profile was written",
  "state.auth .config/manicode/credentials.json: from issue reports, not the README",
  "the native program that the npm launcher downloads into ~/.config/manicode",
]

# mise tool: npm:freebuff
[locate]
mise = "freebuff"
commands = ["freebuff"]

[launch]
# Freebuff has no flags and asks no tool permissions. It logs in through
# the browser. https://github.com/CodebuffAI/freebuff/blob/main/freebuff/README.md
login_callback = true

[state]
auth = [".config/manicode/credentials.json"]
import_ro = [".agents/skills"]

# Freebuff documents no telemetry switch.
[privacy.training]
setting = "the privacy policy of Freebuff"
url = "https://freebuff.com/privacy-policy"
