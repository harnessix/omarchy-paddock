name = "dsh"
description = "DeepSeek Harness"

# Entries that come from documentation, not from a test. paddock doctor lists them.
unverified = [
  "state.auth .dsh/.credentials.yaml and .dsh/.env: where the API key is kept",
  "network.publish 3080: the port of `dsh web`",
  "privacy.uploads: the home patch ~/.dsh/cordis.patch.yml, from the dsh 0.2.1-rc.5 source",
]

# mise tool: npm:@deepseek-ai/dsh
[locate]
mise = "dsh"
commands = ["dsh"]

[launch]
# Since 0.2.1 `dsh` is a launcher that needs a dsh profile name, and has no
# terminal UI: `dsh web` boots the shipped web profile and serves the
# browser UI. Without a name it stops with "--profile <name> is required".
args = ["web"]
# No flag for no approvals: DSH_PERMISSION_MODE sets the mode, and
# omarchy-agent sets it to danger-full-access. `dsh web` opens its page in
# the browser; paddock opens it in the host browser after you allow it.
login_callback = true

[network]
# `dsh web` serves its browser UI on http://127.0.0.1:3080. paddock forwards
# this one port from 127.0.0.1 of the host into the sandbox, so the host
# browser reaches it. https://github.com/deepseek-ai/deepseek-harness
publish = [3080]

[state]
auth = [".dsh/.credentials.yaml", ".dsh/.env"]
import_ro = [".dsh/skills", ".agents/skills"]
env_pass = ["DEEPSEEK_API_KEY"]

# DeepSeek documents no telemetry switch for dsh.
[privacy.training]
setting = "the data settings of your DeepSeek platform account"
url = "https://github.com/deepseek-ai/deepseek-harness"

# The plugin session-log-deepseek is on in every shipped dsh profile. It
# sends the session log with each request to the official DeepSeek API.
# `enabled: false` in its config stops it. paddock adds that row to the
# sandbox copy of the home patch ~/.dsh/cordis.patch.yml, which dsh applies
# after the profile patch. [profiles.dsh] upload_session_logs = true in the
# user configuration keeps the upload on.
# https://github.com/deepseek-ai/deepseek-harness/blob/main/packages/session/session-log-deepseek/README.md
[[privacy.uploads]]
cordis_patch = ".dsh/cordis.patch.yml"
row = "session-log-deepseek"
switch = "upload_session_logs"
says = "the session-log upload to DeepSeek (plugin session-log-deepseek)"
