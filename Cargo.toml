[package]
name = "paddock"
version = "0.1.1"
edition = "2021"
description = "Run any coding-agent harness with full auto-approval inside an isolated sandbox"
license = "MIT"
readme = "README.md"
repository = "https://github.com/harnessix/omarchy-paddock"
keywords = ["sandbox", "agents", "bubblewrap", "docker", "omarchy"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
httparse = "1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
no-proxy = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socks = "0.3"
toml = "0.8"
toml_edit = "0.22"
url = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
