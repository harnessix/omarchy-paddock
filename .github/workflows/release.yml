name: Release

# Builds the Linux binaries of paddock from core/ for a version tag, and
# attaches them to the GitHub Release of that tag. The tag must match CORE,
# so the binaries come from the same paddock release as core/. The release
# notes come from the matching section of core/CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.2.1
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # paddock update and paddock doctor read the releases of this repository.
  PADDOCK_RELEASE_REPO: ${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }}-linux)
    # An older Ubuntu links against an older glibc, so the binary also runs
    # on distributions with a newer one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Check the tag and core/
        run: |
          [ "$(tr -d '[:space:]' < CORE)" = "$TAG" ] || { echo "::error::CORE does not name $TAG"; exit 1; }
          .github/scripts/check-core.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: core
        run: cargo build --release --locked
      - name: Package
        run: |
          name="paddock-${TAG#v}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp core/target/release/paddock core/README.md LICENSE core/CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          version=${TAG#v}
          awk -v v="$version" '$0 == "## " v { on = 1; next } on && /^## / { on = 0; done = 1 } on && !done { print }' core/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::core/CHANGELOG.md has no section $version"; exit 1; }
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          files=(dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --title "paddock ${TAG#v}" --notes-file notes.md "${files[@]}"
          fi
