name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  manifest:
    name: plugin manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/check-manifest.sh
      - run: .github/scripts/check-core.sh

  leak-guard:
    name: leak guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leak guard
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .github/scripts/leak-guard.sh "origin/${{ github.base_ref }}..HEAD"
          else
            .github/scripts/leak-guard.sh
          fi

  # The tests of paddock expect to run at the root of its own repository,
  # so both jobs below copy core/ into a fresh one first.
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy core/ into its own repository
        run: |
          cp -r core "$RUNNER_TEMP/paddock"
          cd "$RUNNER_TEMP/paddock"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt, clippy, test
        working-directory: ${{ runner.temp }}/paddock
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  escape-probe:
    name: escape probe (bwrap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bubblewrap, passt, iproute2
        run: sudo apt-get update && sudo apt-get install -y bubblewrap passt iproute2
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor.
      # bwrap needs them, so allow them on this throwaway runner.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / true
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Build
        working-directory: core
        run: cargo build --locked
      - name: Probe, network none
        run: core/target/debug/paddock doctor --escape --backend bwrap --network none
      - name: Probe, network none, clean env
        run: core/target/debug/paddock doctor --escape --backend bwrap --network none --env clean
      - name: Probe, network egress
        run: core/target/debug/paddock doctor --escape --backend bwrap --network egress --online
